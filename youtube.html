<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
     <!-- 상단 -->
    <header class="header">
        <img src="./images/insta_1.png" alt="인스타 프로필1">
               <label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>
    </header>

    <!-- 메인 내용 -->
    <main>
        <div class="main">

<div class="video-card">
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/l3s_5dHjPnk"
        title="YouTube video player"
        frameborder="0"
        allowfullscreen>
    </iframe>
    

    <h3>밥친구 추천</h3>
    <p>냉장고를 부탁해</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/_KoB4onMgQk"
        title="YouTube video player"
        frameborder="1"
        allowfullscreen>
    </iframe>
    <h3>인생 영화</h3>
    <p>너의 이름은 입니다!! 최애 ost에요</p>
    
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/BahC2CxQzD0"
        title="YouTube video player"
        frameborder="2"
        allowfullscreen>
    </iframe>
    <h3>좋아하는 가수</h3>
    <p>제가 좋아하는 가수는 도경수입니다  <br>아이유랑 불렀어요</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/MlJnHIj9Axg"
        title="YouTube video player"
        frameborder="3"
        allowfullscreen>
    </iframe>
    <h3>인생드라마</h3>
    <p>그 해 우리는</p>
    
</div>


        </div>
        
    </main>

    <!-- 하단 -->
    <footer class="footer">
        <nav class="nav-bar">
            <a href="/">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>
<script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 페이지별 토글 초기 상태 설정
  if (window.location.pathname.includes('hiddenyoutube.html')) {
    toggleBtn.checked = true;  // hidden.html에서는 오른쪽
  } else {
    toggleBtn.checked = false; // index.html에서는 왼쪽
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hiddenyoutube.html'; // 오른쪽으로 이동
    } else {
      window.location.href = 'youtube.html';  // 왼쪽으로 이동
    }
  });
</script>
   

</body>
</html>
