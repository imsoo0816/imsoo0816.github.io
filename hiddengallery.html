<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
     <!-- 상단 -->
    <header class="header">
        <img src="./images/insta_2.png" alt="인스타 프로필2">
       <label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>
    </header>

    <!-- 메인 내용 -->
    <main>
        <div class="main">
            <div>
                <img src="./images/game_img.jpg" alt="">
                <h4>다들 멋있는 게임을 하는 것 같던데.. <br>
                    저는 이런 초딩게임만 합니다,, <br>
                    자주하진 않아요..쩝,,
                </h4>
            </div>
            <div>
<img src="./images/running_img.jpg" alt="">
                <h4>런닝하기 진짜 좋은 곳!! <br>
                정릉천입니당</h4>
</div>
            <div>
<img src="./images/ajs_img.jpg" alt="">
                <h4>저는 유행에 좀 민감하지 못해요,, <br>
                최근까지도 아자스 뜻이 고맙다 인줄 알았어요.. <br>
            요즘 유행은 버터떡 인가요??</h4>

            </div>
<div>
<img src="./images/omg_img.jpg" alt="">
                <h4>쌰갈</h4>

            </div>



        </div>
        
    </main>

    <!-- 하단 -->
    <footer class="footer">
        <nav class="nav-bar">
            <a href="/">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>
   <script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 페이지별 토글 초기 상태 설정
  if (window.location.pathname.includes('hiddengallery.html')) {
    toggleBtn.checked = true;  // hidden.html에서는 오른쪽
  } else {
    toggleBtn.checked = false; // index.html에서는 왼쪽
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hiddengallery.html'; // 오른쪽으로 이동
    } else {
      window.location.href = 'gallery.html';  // 왼쪽으로 이동
    }
  });
</script>

</body>
</html>
