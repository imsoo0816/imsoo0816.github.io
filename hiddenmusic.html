<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
     
    <header class="header">
        <img src="./images/insta_2.png" alt="인스타 프로필2">
                <label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>
    </header>

    
    <main>
        <div class="main">
<h4>즐겨듣는 아티스트 모음</h4>
<div class="video-card">
     <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/ZMppsPVqDt4"
        title="YouTube video player"
        frameborder="0"
        allowfullscreen>
    </iframe>
    

    <h3>Hearts2Hearts</h3>
    <p>Pretty Please-Hearts2Hearts</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/DJF_i7DRAIw"
        title="YouTube video player"
        frameborder="1"
        allowfullscreen>
    </iframe>
    <h3>VVON</h3>
    <p>Time Out-VVON</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/6ZXzn1jwtM4"
        title="YouTube video player"
        frameborder="2"
        allowfullscreen>
    </iframe>
    <h3>잔나비</h3>
    <p>슬픔이여 안녕-잔나비</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/YqPCzTSgXZo"
        title="YouTube video player"
        frameborder="3"
        allowfullscreen>
    </iframe>
    <h3>GIST</h3>
    <p>몇번의 여름-TOIL&GIST</p>
</div>


        </div>
        
    </main>

    
    <footer class="footer">
        <nav class="nav-bar">
            <a href="/">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>
   <script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 페이지별 토글 초기 상태 설정
  if (window.location.pathname.includes('hiddenmusic.html')) {
    toggleBtn.checked = true;  
  } else {
    toggleBtn.checked = false; 
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hiddenmusic.html'; 
    } else {
      window.location.href = 'music.html';  
    }
  });
</script>

</body>
</html>
