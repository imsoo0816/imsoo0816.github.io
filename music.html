<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
     
    <header class="header">
        <img src="./images/insta_1.png" alt="인스타 프로필1">
         <label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>
    </header>

    
    <main>
        
        <div class="main">
            <h4>듣는 음악 장르가 다양한 편이에요  <br> 아는 노래 있나 구경하고 가세요 ㅎㅎ <br> 요즘에는 좀 조용한 노래를 많이 들어요</h4>
            <div id="playlist">
                <img src="./images/playlist_1.jpg" alt="">
                <img src="./images/playlist_2.jpg" alt="">
            </div>



        </div>
        
    </main>

    
    <footer class="footer">
        <nav class="nav-bar">
            <a href="/">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>
<script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 토글 초기 상태 설정
  if (window.location.pathname.includes('hiddenmusic.html')) {
    toggleBtn.checked = true;  
  } else {
    toggleBtn.checked = false; 
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hiddenmusic.html'; 
    } else {
      window.location.href = 'music.html';  
    }
  });

  

</script>
   

</body>
</html>
