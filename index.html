<script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 페이지별 토글 초기 상태 설정
  if (window.location.pathname.includes('hidden.html')) {
    toggleBtn.checked = true;  // hidden.html에서는 오른쪽
  } else {
    toggleBtn.checked = false; // index.html에서는 왼쪽
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hidden.html'; // 오른쪽으로 이동
    } else {
      window.location.href = 'index.html';  // 왼쪽으로 이동
    }
  });
</script>
