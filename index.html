<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
     
    <header class="header">
        <img src="./images/insta_1.png" alt="인스타 프로필1">
<label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>    </header>

   
    <main>
        <div class="main">
          <div id="intro">
<h2>  <strong> 아래 제가 자주 사용하는 어플들</strong>을 누르면 각 페이지가 나옵니다! <br> <br>
   <strong>맨 위 프로필 옆 토글은 </strong> 각 페이지로 이동해서 눌러보세요! 또 다른 정보가!!
      <br>
</h2>
          </div>

        </div>
        
    </main>

    
    <footer class="footer">
        <nav class="nav-bar">
            <a href="./insta.html" class="active">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>

<script>
  const toggleBtn = document.getElementById('toggleBtn');

  //  토글 초기 상태 설정
  if (window.location.pathname.includes('hidden.html')) {
    toggleBtn.checked = true;  
  } else {
    toggleBtn.checked = false;
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hidden.html'; 
    } else {
      window.location.href = 'index.html';  
    }
  });
  // 실제 화면 높이를 CSS 변수로
  function setVh() {
    let vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }
  setVh();
  window.addEventListener('resize', setVh);
</script>

<script>
  
</script>
   

</body>
</html>
