<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
     
    <header class="header">
        <img src="./images/insta_2.png" alt="인스타 프로필2">
               <label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>
    </header>

   
    <main>
        <div class="main">

<div class="video-card">
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/GyXP9lg9Fz0"
        title="YouTube video player"
        frameborder="0"
        allowfullscreen>
    </iframe>
    

    <h3>좋아하는 시리즈</h3>
    <p>옛날꺼로 갈수록 재밌어요</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/Hqi6mbTUFuI"
        title="YouTube video player"
        frameborder="1"
        allowfullscreen>
    </iframe>
    <h3>침착맨 좋아하시는 분</h3>
    <p>저는 가끔 봐여</p>
    <iframe 
        width="350" 
        height="200"
        src="https://www.youtube.com/embed/hEarcgjuLX0"
        title="YouTube video player"
        frameborder="2"
        allowfullscreen>
    </iframe>
    <h3>최고의 연프</h3>
    <p>어느연프도 따라올 수 없는 나솔감성,,</p>
</div>


        </div>
        
    </main>

  
    <footer class="footer">
        <nav class="nav-bar">
            <a href="./insta.html">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html" class="active">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>
   <script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 페이지별 토글 초기 상태 설정
  if (window.location.pathname.includes('hiddenyoutube.html')) {
    toggleBtn.checked = true;  
  } else {
    toggleBtn.checked = false; 
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hiddenyoutube.html'; 
    } else {
      window.location.href = 'youtube.html';  
    }
  });
</script>

</body>
</html>
