<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임수연 자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrapper">
    
    <header class="header">
        <img src="./images/insta_1.png" alt="인스타 프로필1">
      <label class="insta-toggle">
  <input type="checkbox" id="toggleBtn">
  <span class="slider"></span>
</label>
    </header>

   
    <main>
        <div class="main">
            <div>
                <img src="./images/socc_img.jpg" alt="">
                <h4>저는 축구를 즐겨봅니다</h4>
            </div>
            <div>
<img src="./images/base_img.jpg" alt="">
                <h4>야구도 가끔 보고요</h4>

            </div>
<div>
<img src="./images/mc_img.jpg" alt="">
                <h4>마크에서 트롤짓을 자주할 수 있어요 <br>미리 죄송합니다</h4>
</div>
<div>
<img src="./images/jmt_img.jpg" alt="">
                <h4>요리하는 것도 좋아합니다 밑키트 아니에요ㅜ</h4>

</div>



        </div>
        
    </main>

    
    <footer class="footer">
        <nav class="nav-bar">
            <a href="/">
                <img src="./images/insta_icon.png" alt="인스타 로고">
            </a>

            <a href="gallery.html" class="active">
                <img src="./images/gallery_icon.png" alt="사진첩 로고">
            </a>

            <a href="youtube.html">
                <img src="./images/youtube_icon.png" alt="유튜브 로고">
            </a>

            <a href="music.html">
                <img src="./images/music_icon.png" alt="음악 로고">
            </a>
        </nav>
    </footer>
</div>
   <script>
  const toggleBtn = document.getElementById('toggleBtn');

  // 페이지별 토글 초기 상태 설정
  if (window.location.pathname.includes('hiddengallery.html')) {
    toggleBtn.checked = true;  
  } else {
    toggleBtn.checked = false; 
  }

  // 체크 상태가 바뀔 때
  toggleBtn.addEventListener('change', () => {
    if (toggleBtn.checked) { 
      window.location.href = 'hiddengallery.html'; 
    } else {
      window.location.href = 'gallery.html';  
    }
  });
</script>

</body>
</html>
